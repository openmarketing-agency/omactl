name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    if: github.event_name == 'push' && !github.event.deleted
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun test test/unit
      - run: bun run dev -- catalog lint catalog --allow-local-images --json
      - name: Build and publish the Linux package
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            export OMA_BUILD_VERSION="${GITHUB_REF_NAME#v}"
          fi
          bun run build --current
          bun scripts/package-linux.ts

  signed-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Set binary version for a release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'OMA_BUILD_VERSION=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun test test/unit
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: fixtures/testapp
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/omactl-testapp:1.0.0
          build-args: APP_VERSION=1.0.0
      - run: bun scripts/pin-catalog.ts
        env:
          OMA_FIXTURE_IMAGE: ghcr.io/${{ github.repository_owner }}/omactl-testapp
          OMA_FIXTURE_DIGEST: ${{ steps.image.outputs.digest }}
      - run: bun run dev -- catalog lint catalog --json
      - run: bun run build
        env:
          OMA_RELEASE_PUBLIC_KEYS: ${{ vars.OMA_RELEASE_PUBLIC_KEYS }}
      - run: bun run release
        env:
          OMA_RELEASE_PUBLIC_KEYS: ${{ vars.OMA_RELEASE_PUBLIC_KEYS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OMA_RELEASE_PRIVATE_KEY: ${{ secrets.OMA_RELEASE_PRIVATE_KEY }}
          OMA_RELEASE_ASSET_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
          OMA_RELEASE_UPLOAD_URL: ${{ vars.OMA_RELEASE_UPLOAD_URL }}
          OMA_RELEASE_UPLOAD_TOKEN: ${{ secrets.OMA_RELEASE_UPLOAD_TOKEN }}
