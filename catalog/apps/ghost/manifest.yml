id: ghost
name: Ghost
version: 6.78.0
description: Publishing platform with MySQL 8, persistent content and logical database backups
resources:
  memory_mb: 1536
  disk_mb: 2048
requires:
  - traefik
main_service: ghost
routes:
  - name: web
    service: ghost
    port: 2368
    host: "{appId}.{base_domain}"
volumes:
  - key: content
    backup: files
  - key: dbdata
    backup: skip
  - key: dump
    backup: files
stop_during_backup: true
env:
  - name: GHOST_DB_PASSWORD
    generate: password:32
    secret: true
  - name: MYSQL_ROOT_PASSWORD
    generate: password:32
    secret: true
  - name: PUBLIC_URL
    value: "{url:web}"
hooks:
  setup:
    service: ghost
    script: hooks/setup.sh
    timeout: 120
  verify:
    service: ghost
    script: hooks/verify.sh
    timeout: 120
  pre_backup:
    service: db
    script: hooks/dump.sh
    timeout: 300
  post_restore:
    service: db
    script: hooks/load.sh
    timeout: 300
ready_timeout: 180
