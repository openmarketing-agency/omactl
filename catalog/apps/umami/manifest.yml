id: umami
name: Umami
version: 3.5.0
description: Website analytics with PostgreSQL, generated administrator credentials and logical backups
resources:
  memory_mb: 1024
  disk_mb: 2048
requires:
  - traefik
main_service: umami
routes:
  - name: web
    service: umami
    port: 3000
    host: "{appId}.{base_domain}"
volumes:
  - key: pgdata
    backup: skip
  - key: dump
    backup: files
stop_during_backup: true
env:
  - name: POSTGRES_PASSWORD
    generate: password:32
    secret: true
  - name: APP_SECRET
    generate: token:64
    secret: true
  - name: UMAMI_ADMIN_PASSWORD
    generate: password:32
    secret: true
hooks:
  setup:
    service: umami
    script: hooks/app.sh
    timeout: 120
  verify:
    service: umami
    script: hooks/app.sh
    timeout: 120
  pre_backup:
    service: db
    script: hooks/dump.sh
    timeout: 300
  post_restore:
    service: db
    script: hooks/load.sh
    timeout: 300
ready_timeout: 180
