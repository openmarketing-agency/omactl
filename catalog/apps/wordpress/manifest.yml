id: wordpress
name: WordPress
version: 7.1.4
description: WordPress with MariaDB, unattended setup, persistent uploads and
  database dump backups
resources:
  memory_mb: 1024
  disk_mb: 2048
requires:
  - traefik
main_service: wordpress
routes:
  - name: web
    service: wordpress
    port: 80
    host: "{appId}.{base_domain}"
volumes:
  - key: html
    backup: files
  - key: dbdata
    backup: skip
  - key: dump
    backup: files
stop_during_backup: true
env:
  - name: WORDPRESS_DB_PASSWORD
    generate: password:32
    secret: true
  - name: MARIADB_ROOT_PASSWORD
    generate: password:32
    secret: true
  - name: WORDPRESS_ADMIN_PASSWORD
    generate: password:32
    secret: true
  - name: WORDPRESS_AUTH_KEY
    generate: token:64
    secret: true
  - name: WORDPRESS_SECURE_AUTH_KEY
    generate: token:64
    secret: true
  - name: WORDPRESS_LOGGED_IN_KEY
    generate: token:64
    secret: true
  - name: WORDPRESS_NONCE_KEY
    generate: token:64
    secret: true
  - name: WORDPRESS_AUTH_SALT
    generate: token:64
    secret: true
  - name: WORDPRESS_SECURE_AUTH_SALT
    generate: token:64
    secret: true
  - name: WORDPRESS_LOGGED_IN_SALT
    generate: token:64
    secret: true
  - name: WORDPRESS_NONCE_SALT
    generate: token:64
    secret: true
  - name: WORDPRESS_ADMIN_USER
    value: oma-admin
  - name: WORDPRESS_ADMIN_EMAIL
    value: admin@{appId}.{base_domain}
  - name: WORDPRESS_SITE_TITLE
    value: OMA WordPress
  - name: PUBLIC_URL
    value: "{url:web}"
hooks:
  setup:
    service: wpcli
    script: hooks/setup.sh
    timeout: 180
  verify:
    service: wpcli
    script: hooks/verify.sh
    timeout: 180
  pre_backup:
    service: db
    script: hooks/dump.sh
    timeout: 300
  post_restore:
    service: db
    script: hooks/load.sh
    timeout: 300
  migrate:
    service: wordpress
    script: hooks/migrate.sh
    timeout: 180
ready_timeout: 180
